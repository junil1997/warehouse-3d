<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache">
<title>창고 3D 배치</title>
<style>
  :root {
    --bg: #eef0f3; --panel: #ffffff; --line: #e2e5ea; --text: #1f2328; --muted: #6a737d;
    --accent: #2f6fde; --warn: #d93b30; --sel: #fff4d6;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: "Pretendard", "Malgun Gothic", system-ui, sans-serif; font-size: 13px; color: var(--text); background: var(--bg); }
  #app { display: flex; height: 100vh; }
  #viewport { position: relative; flex: 1; min-width: 0; overflow: hidden; }
  #viewport canvas { display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; }
  .labels.measure .lbl { display: none; }
  .lbl { font-size: 11px; background: rgba(255,255,255,.85); border: 1px solid rgba(0,0,0,.12); padding: 1px 5px; border-radius: 4px; white-space: nowrap; color: #333; }
  .lbl.sel { background: #ffb000; color: #000; font-weight: 600; }
  .lbl.warn { border-color: var(--warn); color: var(--warn); }
  .dim { font-size: 10px; color: #5b6470; background: rgba(238,240,243,.9); padding: 0 4px; border-radius: 3px; }
  .dim.wall { color: #b0475c; font-weight: 600; }
  .dim.wall.ok { color: #1b7f3b; }
  .corner { font-size: 13px; font-weight: 800; color: #fff; background: #b0475c; width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
  .dimin { display: flex; align-items: center; gap: 3px; background: rgba(255,255,255,.96); border: 1px solid #d9a9b5; border-radius: 6px; padding: 1px 3px 1px 5px; font-size: 11px; font-weight: 700; color: #b0475c; white-space: nowrap; pointer-events: auto; }
  .dimin:focus-within { z-index: 99999 !important; box-shadow: 0 0 0 2px var(--accent); }
  .dimin.ok { border-color: #1b7f3b; background: #f3fbf5; color: #1b7f3b; }
  .dimin.ang { padding-left: 1px; color: var(--muted); font-weight: 400; border-color: var(--line); }
  .dimin .corner { width: 20px; height: 20px; font-size: 12px; }
  .dimin input { width: 46px; padding: 1px 3px; font-size: 12px; text-align: right; user-select: text; -moz-appearance: textfield; appearance: textfield; }
  .dimin.ang input { width: 40px; }
  .dimin input::-webkit-inner-spin-button, #measbar input::-webkit-inner-spin-button { display: none; }
  #measbar { flex-basis: 100%; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; background: rgba(255,255,255,.96); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font-size: 12px; }
  #measbar[hidden] { display: none; }
  #measbar input { width: 58px; padding: 2px 4px; text-align: right; }
  #measbar b { color: #1b7f3b; }
  .okbox { background: #e8f5ec; color: #1b7f3b; border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  table.walls td { padding: 2px 1px; }
  table.walls input, table.walls select { padding: 4px 4px; font-size: 12px; }
  table.walls input.meas { border-color: #1b7f3b; background: #f3fbf5; }
  table.walls .wn { font-weight: 700; color: var(--text); white-space: nowrap; }
  table.walls .wm { display: block; font-size: 10px; color: var(--muted); font-weight: 400; }
  details { margin: 10px 0; color: var(--muted); }
  #hud { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px; z-index: 2; }
  #hud button, .btn { border: 1px solid var(--line); background: #fff; padding: 6px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
  #hud button.on { background: var(--accent); color: #fff; border-color: var(--accent); }
  #cloud { position: absolute; top: 10px; right: 10px; z-index: 2; display: flex; align-items: center; gap: 6px; background: rgba(255,255,255,.92); border: 1px solid var(--line); border-radius: 8px; padding: 4px 4px 4px 10px; max-width: calc(100% - 20px); }
  #cloud .msg { font-size: 12px; color: var(--muted); }
  #cloud .msg.dirty { color: #c26a00; font-weight: 600; }
  #cloud .msg.err { color: var(--warn); }
  #cloud button { border: 1px solid var(--line); background: #fff; padding: 5px 9px; border-radius: 6px; cursor: pointer; font: inherit; }
  #cloud button.primary { background: var(--accent); color: #fff; border-color: var(--accent); font-weight: 600; }
  #cloud button:disabled { opacity: .45; cursor: default; }
  @media (max-width: 800px) { #cloud { top: auto; bottom: 52px; } }
  #help { position: absolute; left: 10px; bottom: 10px; background: rgba(255,255,255,.88); border-radius: 6px; padding: 6px 10px; color: var(--muted); font-size: 12px; z-index: 2; max-width: calc(100% - 20px); }
  #panel { width: 430px; flex-shrink: 0; background: var(--panel); border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
  #panel header { padding: 12px 14px 8px; border-bottom: 1px solid var(--line); }
  #panel header b { font-size: 15px; }
  #panel header .sub { color: var(--muted); margin-top: 2px; }
  .tabs { display: flex; border-bottom: 1px solid var(--line); }
  .tabs button { flex: 1; border: 0; background: none; padding: 9px 4px; cursor: pointer; font: inherit; color: var(--muted); border-bottom: 2px solid transparent; }
  .tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  .tab { display: none; overflow-y: auto; padding: 10px 14px 24px; flex: 1; min-height: 0; }
  .tab.on { display: block; }
  .tools { display: flex; gap: 6px; margin-bottom: 8px; }
  .tools input { flex: 1; }
  input, select, textarea { font: inherit; padding: 5px 7px; border: 1px solid var(--line); border-radius: 5px; background: #fff; color: var(--text); min-width: 0; }
  input[type=color] { padding: 1px; height: 30px; width: 46px; }
  input[type=checkbox] { width: auto; }
  .summary { color: var(--muted); margin-bottom: 6px; line-height: 1.7; }
  .chip { display: inline-block; padding: 0 6px; border-radius: 10px; color: #fff; font-size: 11px; }
  h4 { margin: 14px 0 4px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .row { display: flex; align-items: center; gap: 6px; padding: 5px 4px; border-radius: 5px; cursor: pointer; }
  .row:hover { background: #f4f6f8; }
  .row.sel { background: var(--sel); }
  .row.off .nm, .row.off .sz { color: #aab; text-decoration: line-through; }
  .dot { width: 10px; height: 10px; border-radius: 3px; flex-shrink: 0; border: 1px solid rgba(0,0,0,.15); }
  .nm { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sz { color: var(--muted); font-size: 11px; white-space: nowrap; }
  .st { font-size: 11px; padding: 0 5px; border-radius: 8px; color: #fff; white-space: nowrap; }
  .warn { color: var(--warn); }
  .grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px 8px; margin: 6px 0 10px; }
  .grid.two { grid-template-columns: 1fr 1fr; }
  label.f { display: flex; flex-direction: column; gap: 2px; color: var(--muted); font-size: 11px; }
  label.f input, label.f select, label.f textarea { color: var(--text); font-size: 13px; width: 100%; }
  .full { grid-column: 1 / -1; }
  .btns { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.danger { color: var(--warn); }
  .hint { color: var(--muted); line-height: 1.6; }
  table { width: 100%; border-collapse: collapse; }
  td, th { padding: 3px 2px; text-align: left; font-weight: normal; color: var(--muted); font-size: 12px; }
  td input, td select { width: 100%; }
  .issues { background: #fdecea; color: var(--warn); border-radius: 6px; padding: 6px 8px; margin: 6px 0; }
  .snap { display: flex; align-items: center; gap: 6px; padding: 4px 0; border-bottom: 1px solid var(--line); }
  .snap span { flex: 1; }
  @media (max-width: 800px) {
    #app { flex-direction: column; height: auto; }
    #viewport { height: 60vh; flex: none; }
    #panel { width: 100%; border-left: 0; border-top: 1px solid var(--line); }
    .tab { max-height: none; }
  }
</style>
<script>
  // 데이터 파일은 항상 최신으로 (브라우저 캐시 때문에 예전 배치가 보이지 않게)
  document.write('<script src="data/config.js?t=' + Date.now() + '"><\/script><script src="data/layout.js?t=' + Date.now() + '"><\/script>');
</script>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<body>
<div id="app">
  <div id="viewport">
    <div id="hud">
      <button id="btn3d">3D 보기</button>
      <button id="btnTop">평면도</button>
      <button id="btnColor">상태별 색</button>
      <button id="btnLabels">이름표</button>
      <button id="btnUndo" title="Ctrl+Z">되돌리기</button>
      <button id="btnMeasure" title="평면도 위 모서리·벽마다 줄자 값과 천장 높이 넣기">📏 치수 기입</button>
      <button id="btnRoomEdit" title="평면도에서 모서리를 끌어 벽 모양 바꾸기">✏ 벽 모양 편집</button>
      <div id="measbar" hidden></div>
    </div>
    <div id="cloud"><span class="msg" id="cloudMsg"></span><span id="cloudBtns"></span></div>
    <div id="help">왼쪽 드래그: 회전 · 오른쪽 드래그: 화면 이동 · 휠: 확대 · <b>물품을 끌면 위치 이동</b>(Shift: 1cm 단위) · R: 90° 회전 · 방향키: 5cm 이동 · Del: 빼기 · Ctrl+Z: 되돌리기</div>
  </div>
  <aside id="panel">
    <header>
      <div><b id="title">창고 배치</b> <span id="ver" class="sz"></span></div>
      <div class="sub" id="roomInfo"></div>
    </header>
    <nav class="tabs">
      <button data-tab="list" class="on">물품 목록</button>
      <button data-tab="edit">선택 물품</button>
      <button data-tab="room">공간 치수</button>
      <button data-tab="file">저장·버전</button>
    </nav>
    <section class="tab on" id="tab-list">
      <div class="tools">
        <input id="q" placeholder="이름·분류·메모 검색">
        <select id="filter">
          <option value="all">전체</option>
          <option value="placed">배치된 것</option>
          <option value="out">빼둔 것</option>
          <option value="미정">미정</option>
          <option value="유지">유지</option>
          <option value="이동">이동</option>
          <option value="폐기">폐기</option>
          <option value="issue">⚠ 겹침·벽밖</option>
        </select>
      </div>
      <div id="listBody"></div>
    </section>
    <section class="tab" id="tab-edit"></section>
    <section class="tab" id="tab-room"></section>
    <section class="tab" id="tab-file"></section>
  </aside>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

// ───────── 상태 ─────────
const STORE_KEY = 'warehouse-layout-v1', SNAP_KEY = 'warehouse-snapshots-v1', UI_KEY = 'warehouse-ui-v1';
const S = 0.01; // cm → 3D 단위(m)
const STATUS = { '미정': '#9aa0a6', '유지': '#43a047', '이동': '#1e88e5', '폐기': '#e53935' };
const TYPES = { box: '박스/일반', cabinet: '도어 캐비닛', glasscab: '유리장', shelf: '오픈 선반', rack: '옷 행거', cart: '핸드카트', stand: '스탠드', beanbag: '빈백', soft: '이불·쿠션', panel: '판넬(기댐)', pile: '잡동사니 더미' };
const clone = o => JSON.parse(JSON.stringify(o));
const isBuilding = it => it.cat === '건물'; // 기둥 등 건물 일부 — 가구 전체 빼기에서 제외
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let archivedFrom = null;
let state = loadState();
let ui = Object.assign({ labels: true, colorMode: 'color', tab: 'list', q: '', filter: 'all' }, readJSON(UI_KEY) || {});
let selectedId = null;
let issues = {};
const undoStack = [];

function readJSON(key) { try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : null; } catch (e) { return null; } }
function writeJSON(key, v) { try { localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
function loadState() {
  const s = readJSON(STORE_KEY), def = window.WAREHOUSE_DEFAULT;
  if (!(s && s.room && Array.isArray(s.room.walls))) return clone(def);
  if (!String(window.WAREHOUSE_API || '').trim() && s.meta?.version !== def.meta.version) {
    // 새 기본 배치(data/layout.js)가 올라옴 → 이 브라우저의 이전 작업은 스냅샷으로 보관하고 새 배치로 시작
    const snaps = readJSON(SNAP_KEY) || [];
    snaps.unshift({ name: `자동 보관: 이전 작업 (v${s.meta?.version || '?'})`, date: new Date().toLocaleString('ko-KR'), data: s });
    writeJSON(SNAP_KEY, snaps);
    archivedFrom = s.meta?.version || '?';
    return clone(def);
  }
  return s;
}
function saveState() {
  state.meta.updated = new Date().toISOString().slice(0, 10);
  writeJSON(STORE_KEY, state);
  if (!cloud.dirty) { cloud.dirty = true; saveCloud(); renderCloud(); }
}

// ───────── 공유 저장소 (구글 시트) ─────────
const API = String(window.WAREHOUSE_API || '').trim();
const CLOUD_KEY = 'warehouse-cloud-v1';
let cloud = Object.assign({ baseRev: 0, dirty: false, editor: '', passcode: '' }, readJSON(CLOUD_KEY) || {});
const cs = { mode: API ? 'loading' : 'local', head: null, pending: null, busy: false, msg: '', history: null };
function saveCloud() { writeJSON(CLOUD_KEY, cloud); }
async function api(params, body) {
  const url = API + (params ? (API.includes('?') ? '&' : '?') + new URLSearchParams(params) : '');
  const res = await fetch(url, body ? { method: 'POST', body: JSON.stringify(body), headers: { 'Content-Type': 'text/plain;charset=utf-8' } } : { cache: 'no-store' });
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
function applyServer(r) {
  state = r.data;
  cloud.baseRev = r.rev; cloud.dirty = false; saveCloud();
  writeJSON(STORE_KEY, state);
  cs.head = { rev: r.rev, savedAt: r.savedAt, editor: r.editor };
  cs.pending = null;
  undoStack.length = 0;
  if (selectedId && !getItem(selectedId)) selectedId = null;
  rebuildAll();
}
async function cloudLoad({ force = false } = {}) {
  if (!API) return;
  cs.busy = true; renderCloud();
  try {
    const r = await api({ action: 'latest' });
    cs.mode = 'online';
    if (!r.rev) { cs.head = { rev: 0 }; }
    else if (force || !cloud.dirty || r.rev === cloud.baseRev) {
      if (force || !cloud.dirty) applyServer(r); else cs.head = { rev: r.rev, savedAt: r.savedAt, editor: r.editor };
    } else { cs.head = { rev: r.rev, savedAt: r.savedAt, editor: r.editor }; cs.pending = r; }
  } catch (err) { cs.mode = 'offline'; cs.msg = err.message; }
  cs.busy = false; renderCloud();
}
async function cloudPoll() {
  if (!API || cs.busy || drag || cornerDrag || document.hidden || cs.mode === 'loading') return;
  try {
    const h = await api({ action: 'rev' });
    cs.mode = 'online';
    if (h.rev && h.rev !== cloud.baseRev) {
      if (!cloud.dirty) return cloudLoad();
      if (!cs.pending || cs.pending.rev !== h.rev) cs.pending = { rev: h.rev, savedAt: h.savedAt, editor: h.editor };
    }
  } catch (err) { cs.mode = 'offline'; cs.msg = err.message; }
  renderCloud();
}
async function cloudSave(force = false) {
  if (!API || cs.busy) return;
  if (!cloud.editor) {
    const n = prompt('저장하는 사람 이름을 적어 주세요. (저장 이력에 남아요)', '');
    if (!n || !n.trim()) return;
    cloud.editor = n.trim(); saveCloud();
  }
  const note = prompt('무엇을 바꿨는지 짧게 적어 주세요. (비워도 됨)', '');
  if (note === null) return;
  cs.busy = true; renderCloud();
  try {
    const r = await api(null, { action: 'save', baseRev: cloud.baseRev, force, editor: cloud.editor, note, passcode: cloud.passcode, data: state });
    if (r.ok) {
      cloud.baseRev = r.rev; cloud.dirty = false; state.meta.rev = r.rev; saveCloud();
      writeJSON(STORE_KEY, state);
      cs.head = { rev: r.rev, savedAt: r.savedAt, editor: cloud.editor };
      cs.pending = null; cs.history = null; cs.mode = 'online';
    } else if (r.error === 'bad_passcode') {
      const p = prompt('공유 암호가 필요해요. 관리자에게 받은 암호를 입력하세요.', '');
      if (p) { cloud.passcode = p.trim(); saveCloud(); cs.busy = false; return cloudSave(force); }
    } else if (r.error === 'conflict') {
      cs.pending = r;
      if (confirm(`${r.editor || '다른 사람'}님이 먼저 저장한 새 버전(r${r.rev})이 있어요.\n\n[확인] 내 변경은 버리고 새 버전 불러오기\n[취소] 내 변경 그대로 두기 (위의 "덮어쓰기"로 강제 저장 가능)`)) applyServer(r);
    } else alert('저장 실패: ' + (r.error || '알 수 없음'));
  } catch (err) { cs.mode = 'offline'; cs.msg = err.message; alert('공유 저장소에 연결하지 못했어요. 변경은 이 브라우저에 남아 있어요.\n' + err.message); }
  cs.busy = false; renderCloud(); renderFile();
}
const fmtTime = s => { const d = new Date(s); return isNaN(d) ? '' : d.toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }); };
function renderCloud() {
  const msg = document.getElementById('cloudMsg'), btns = document.getElementById('cloudBtns');
  if (!msg) return;
  let m = '', cls = 'msg', b = '';
  if (cs.mode === 'local') {
    m = archivedFrom
      ? `새 배치 v${esc(state.meta.version)} 적용됨 — 이 브라우저의 이전 작업(v${esc(archivedFrom)})은 [저장·버전] 스냅샷에 보관`
      : '이 브라우저에만 저장 중 (공유 저장소 미설정)';
  }
  else if (cs.mode === 'loading') { m = '공유 저장소 연결 중…'; }
  else if (cs.mode === 'offline') { m = '⚠ 공유 저장소 연결 실패 — 이 브라우저에만 저장 중'; cls += ' err'; b = '<button data-cloud="reload">다시 연결</button>'; }
  else {
    const h = cs.head;
    if (cloud.dirty) { m = '● 저장 안 된 변경 있음'; cls += ' dirty'; }
    else if (h && h.rev) m = `✓ 공유 저장됨 r${h.rev} · ${esc(h.editor || '')} ${fmtTime(h.savedAt)}`;
    else m = '공유 저장소 비어 있음 — 저장하면 r1 생성';
    if (cs.pending) {
      m += ` · <b>${esc(cs.pending.editor || '다른 사람')}님 새 버전 r${cs.pending.rev}</b>`;
      b += '<button data-cloud="take">새 버전 불러오기</button><button data-cloud="force" title="새 버전을 무시하고 내 것으로 저장">덮어쓰기</button>';
    }
    b += `<button class="primary" data-cloud="save" ${cloud.dirty && !cs.busy ? '' : 'disabled'}>${cs.busy ? '저장 중…' : '☁ 저장'}</button>`;
  }
  msg.className = cls;
  msg.innerHTML = m;
  btns.innerHTML = b;
}
document.getElementById('cloud').addEventListener('click', e => {
  const a = e.target.closest('[data-cloud]')?.dataset.cloud;
  if (a === 'save') cloudSave(false);
  else if (a === 'force') { if (confirm('다른 사람이 저장한 새 버전 위에 내 배치를 덮어쓸까요? (그 버전도 이력에는 남아요)')) cloudSave(true); }
  else if (a === 'take') { if (!cloud.dirty || confirm('내 저장 안 된 변경을 버리고 새 버전을 불러올까요?')) cloudLoad({ force: true }); }
  else if (a === 'reload') cloudLoad();
});
window.addEventListener('beforeunload', e => { if (API && cloud.dirty) { e.preventDefault(); e.returnValue = ''; } });
async function loadHistory() {
  try { cs.history = (await api({ action: 'history', limit: 50 })).versions || []; }
  catch (err) { cs.history = []; alert('이력을 불러오지 못했어요: ' + err.message); }
  renderFile();
}
async function openVersion(rev) {
  try {
    const r = await api({ action: 'version', rev });
    if (!r.data) throw new Error('버전을 찾지 못함');
    if (confirm(`r${rev} (${r.editor || ''} ${fmtTime(r.savedAt)}) 배치를 불러올까요?\n불러온 뒤 [☁ 저장]을 눌러야 모두에게 반영돼요.`)) commit(() => { state = r.data; });
  } catch (err) { alert('불러오기 실패: ' + err.message); }
}
function saveUI() { writeJSON(UI_KEY, { labels: ui.labels, colorMode: ui.colorMode, tab: ui.tab }); }
function getItem(id) { return state.items.find(i => i.id === id); }
function commit(fn) {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 100) undoStack.shift();
  fn();
  saveState();
  rebuildAll();
}
function undo() {
  if (!undoStack.length) return;
  state = JSON.parse(undoStack.pop());
  saveState();
  if (selectedId && !getItem(selectedId)) selectedId = null;
  rebuildAll();
}

// ───────── 기하 유틸 ─────────
function inPoly(x, z, P) {
  let c = false;
  for (let i = 0, j = P.length - 1; i < P.length; j = i++) {
    const [xi, zi] = P[i], [xj, zj] = P[j];
    if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c;
  }
  return c;
}
function corners(it, shrink = 0) {
  const th = -(it.rot || 0) * Math.PI / 180, c = Math.cos(th), s = Math.sin(th);
  const hw = Math.max(0.1, it.w / 2 - shrink), hd = Math.max(0.1, it.d / 2 - shrink);
  return [[-hw, -hd], [hw, -hd], [hw, hd], [-hw, hd]].map(([lx, lz]) => [it.x + lx * c + lz * s, it.z - lx * s + lz * c]);
}
function rectsOverlap(A, B) {
  for (const P of [A, B]) for (let i = 0; i < 4; i++) {
    const [x1, z1] = P[i], [x2, z2] = P[(i + 1) % 4];
    const nx = z2 - z1, nz = x1 - x2;
    const proj = R => R.map(([x, z]) => x * nx + z * nz);
    const a = proj(A), b = proj(B);
    if (Math.max(...a) <= Math.min(...b) || Math.max(...b) <= Math.min(...a)) return false;
  }
  return true;
}
function computeIssues() {
  issues = {};
  const add = (id, msg) => (issues[id] = issues[id] || []).push(msg);
  const placed = state.items.filter(i => i.placed !== false);
  const floor = placed.filter(i => (i.y || 0) < 1);
  for (const it of placed) {
    if (corners(it, 1).some(([x, z]) => !inPoly(x, z, geom.outline))) add(it.id, '벽 밖으로 나감');
    if ((it.y || 0) + it.h > state.room.height) add(it.id, '천장 높이 초과');
  }
  for (let i = 0; i < floor.length; i++) for (let j = i + 1; j < floor.length; j++) {
    if (rectsOverlap(corners(floor[i], 1), corners(floor[j], 1))) {
      add(floor[i].id, `겹침: ${floor[j].name}`);
      add(floor[j].id, `겹침: ${floor[i].name}`);
    }
  }
}

// ───────── 공간 계산: 벽 길이·모서리 각도·휨 → 좌표 ─────────
const LET = i => (i < 26 ? String.fromCharCode(65 + i) : 'Z' + (i - 25));
const effLen = w => (w.measured > 0 ? w.measured : w.len);
const KINDS = { wall: '벽', window: '창문', glass: '유리칸막이' };
let geom = null;
function computeGeom() {
  const r = state.room;
  let [x, z] = r.start || [0, 0];
  let hd = (r.heading ?? 0) * Math.PI / 180;
  const corners = [[x, z]];
  r.walls.forEach((w, i) => {
    const L = effLen(w);
    x += Math.cos(hd) * L; z += Math.sin(hd) * L;
    if (i < r.walls.length - 1) { corners.push([x, z]); hd += (180 - (w.angle ?? 90)) * Math.PI / 180; }
  });
  const closeErr = Math.hypot(x - corners[0][0], z - corners[0][1]);
  const n = corners.length;
  let a2 = 0;
  for (let i = 0; i < n; i++) { const [x1, z1] = corners[i], [x2, z2] = corners[(i + 1) % n]; a2 += x1 * z2 - x2 * z1; }
  const sgn = a2 >= 0 ? 1 : -1;
  const outOf = (a, b) => { const dx = b[0] - a[0], dz = b[1] - a[1], l = Math.hypot(dx, dz) || 1; return [sgn * dz / l, -sgn * dx / l]; };
  const walls = r.walls.map((w, i) => {
    const P = corners[i], Q = corners[(i + 1) % n];
    const dx = Q[0] - P[0], dz = Q[1] - P[1];
    const out = outOf(P, Q), b = w.bulge || 0;
    const segs = !b ? 1 : (w.kind === 'window' ? Math.max(2, Math.round(Math.hypot(dx, dz) / 150)) : 16);
    const pts = [];
    for (let k = 0; k <= segs; k++) { const t = k / segs, s = b * 4 * t * (1 - t); pts.push([P[0] + dx * t + out[0] * s, P[1] + dz * t + out[1] * s]); }
    let len = 0;
    for (let k = 0; k < segs; k++) len += Math.hypot(pts[k + 1][0] - pts[k][0], pts[k + 1][1] - pts[k][1]);
    return { i, pts, len, out, kind: w.kind || 'wall', mid: [P[0] + dx / 2 + out[0] * b, P[1] + dz / 2 + out[1] * b],
      outStart: outOf(pts[0], pts[1]), outEnd: outOf(pts[segs - 1], pts[segs]) };
  });

}
function cornerAngle(i) {
  const c = geom.corners, n = c.length, [x, z] = c[i], [px, pz] = c[(i - 1 + n) % n], [qx, qz] = c[(i + 1) % n];
  let t = (Math.atan2(qz - z, qx - x) - Math.atan2(z - pz, x - px)) * 180 / Math.PI;
  while (t <= -180) t += 360;
  while (t > 180) t -= 360;
  return Math.round((180 - t) * 10) / 10;
}
// 모서리 좌표 → 벽 길이·각도 (평면도에서 모서리를 끌었을 때)
function setCorners(cs) {
  const r = state.room, n = cs.length, r1 = v => Math.round(v * 10) / 10;
  const hd = i => Math.atan2(cs[(i + 1) % n][1] - cs[i][1], cs[(i + 1) % n][0] - cs[i][0]);
  r.start = [r1(cs[0][0]), r1(cs[0][1])];
  r.heading = r1(hd(0) * 180 / Math.PI);
  r.walls.forEach((w, i) => {
    const [x1, z1] = cs[i], [x2, z2] = cs[(i + 1) % n];
    w.len = r1(Math.hypot(x2 - x1, z2 - z1));
    let t = (hd((i + 1) % n) - hd(i)) * 180 / Math.PI;
    while (t <= -180) t += 360;
    while (t > 180) t -= 360;
    w.angle = r1(180 - t);
  });

// ───────── 공간(바닥·벽·문·창) ─────────
function disposeGroup(g) {

}
function buildRoom() {

  roomGroup.add(floor);

  // 50cm 격자 (방 안쪽만)
  const pts = [];

    for (let z = bounds.minZ; z < bounds.maxZ; z += step) {
      const z2 = Math.min(z + step, bounds.maxZ);
      if (inPoly(x + 0.01, (z + z2) / 2, outline) || inPoly(x - 0.01, (z + z2) / 2, outline)) pts.push(x * S, 0.002, z * S, x * S, 0.002, z2 * S);
    }
  for (let z = Math.ceil(bounds.minZ / step) * step; z <= bounds.maxZ; z += step)
    for (let x = bounds.minX; x < bounds.maxX; x += step) {
      const x2 = Math.min(x + step, bounds.maxX);
      if (inPoly((x + x2) / 2, z + 0.01, outline) || inPoly((x + x2) / 2, z - 0.01, outline)) pts.push(x * S, 0.002, z * S, x2 * S, 0.002, z * S);
    }

  gg.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));

    const glassMat = new THREE.MeshStandardMaterial({ color: 0x9fc6d8, roughness: 0.1, transparent: true, opacity: 0.28, depthWrite: false });
    const frameMat = new THREE.MeshStandardMaterial({ color: 0x3a4048, transparent: true });

    const grp = new THREE.Group();
    walls.push({ mid: { x: gw.mid[0] * S, z: gw.mid[1] * S }, n: { x: gw.out[0], z: gw.out[1] }, mats: [[wallMat, 1], [glassMat, 0.28], [frameMat, 1]] });
    const ops = doors.filter(d => d.wall === gw.i)
      .map(d => ({ a: Math.max(0, d.offset - d.width / 2), b: Math.min(gw.len, d.offset + d.width / 2), h: Math.min(H, d.height || 210), type: d.type || 'door' }));

    for (let k = 0; k < gw.pts.length - 1; k++) {
      const [x1, z1] = gw.pts[k], [x2, z2] = gw.pts[k + 1];
      const len = Math.hypot(x2 - x1, z2 - z1);

        if (b - a < 0.5 || y1 - y0 < 0.5) return;
        const m = new THREE.Mesh(new THREE.BoxGeometry((b - a) * S, (y1 - y0) * S, thick * S), mat);
        const c = (a + b) / 2;
        m.position.set((x1 + ux * c + nx * T / 2) * S, (y0 + y1) / 2 * S, (z1 + uz * c + nz * T / 2) * S);
        m.rotation.y = -Math.atan2(uz, ux);
        m.receiveShadow = true;
        grp.add(m);
      };
      const solid = (a, b) => {
        if (b - a < 0.5) return;
        if (gw.kind === 'window') {
          seg(a, b, 0, sill, wallMat);
          seg(a, b, sill, H - 15, glassMat, 4);
          seg(a, b, H - 15, H, wallMat);
          seg(a, b, sill, sill + 5, frameMat, T + 2);
          for (let m = a + 150; m < b - 20; m += 150) seg(m - 2.5, m + 2.5, sill, H - 15, frameMat, 8);
        } else if (gw.kind === 'glass') {
          seg(a, b, 0, 10, frameMat, T);
          seg(a, b, 10, H, glassMat, 4);
          seg(a, b, 225, 230, frameMat, 8);
          for (let m = a + 120; m < b - 20; m += 120) seg(m - 2.5, m + 2.5, 0, H, frameMat, 8);
        } else seg(a, b, 0, H, wallMat);
      };
      if (k > 0 && gw.kind === 'window') seg(0, 4, sill, H - 15, frameMat, 10); // 곡면 유리 꺾이는 곳 창틀
      const local = ops.filter(o => o.b > c0 && o.a < c0 + len)
        .map(o => ({ ...o, a: Math.max(0, o.a - c0), b: Math.min(len, o.b - c0) })).sort((p, q) => p.a - q.a);
      let cur = 0;
      for (const o of local) {
        solid(cur, o.a);
        seg(o.a, o.b, o.h, H, gw.kind === 'wall' ? wallMat : glassMat, gw.kind === 'wall' ? T : 4);
        seg(o.a, o.a + 5, 0, o.h, frameMat, T + 2);
        seg(o.b - 5, o.b, 0, o.h, frameMat, T + 2);
        seg(o.a, o.b, o.h - 5, o.h, frameMat, T + 2);

      solid(cur, len);
      c0 += len;
    }
    roomGroup.add(grp);

    // 벽 이름·길이 (실측이면 초록)
    const w = state.room.walls[gw.i];
    const el = document.createElement('div');
    const wname = `${LET(gw.i)}–${LET((gw.i + 1) % nW)}`;
    if (ui.measure) {
      el.className = 'dimin' + (w.measured > 0 ? ' ok' : '');
      el.innerHTML = `${wname}<input type="number" min="1" step="0.1" data-dim="w${gw.i}" tabindex="${gw.i + 3}" value="${w.measured > 0 ? w.measured : ''}" placeholder="${Math.round(w.len)}" title="${wname} 줄자로 잰 길이(cm) — 비우면 ${esc(state.room.source || '추정')} 값 ${Math.round(w.len)}cm 사용">`;
    } else {
      el.className = 'dim wall' + (w.measured > 0 ? ' ok' : '');
      el.textContent = `${wname} ${Math.round(effLen(w))}cm${w.measured > 0 ? ' ✓' : ` (${state.room.source || '추정'})`}`;
    }
    const lab = new CSS2DObject(el);
    const off = ui.measure ? 35 + 50 * Math.abs(gw.out[0]) : -32; // 치수 기입 중엔 벽 바깥에 입력칸 (가로로 긴 칸이라 옆쪽은 더 띄움)
    lab.position.set((gw.mid[0] + gw.out[0] * off) * S, 0.02, (gw.mid[1] + gw.out[1] * off) * S);
    dimGroup.add(lab);
  }

  // 모서리: 바깥 틈 메우기 + A,B,C… 표시
  geom.corners.forEach(([cx, cz], i) => {
    const o1 = geom.walls[(i - 1 + nW) % nW].outEnd, o2 = geom.walls[i].outStart;
    const ox = (o1[0] + o2[0]) / 2, oz = (o1[1] + o2[1]) / 2;
    const post = new THREE.Mesh(new THREE.BoxGeometry(T * S, H * S, T * S), cornerMats[i]);
    post.position.set((cx + ox * T) * S, H / 2 * S, (cz + oz * T) * S);
    post.rotation.y = -Math.atan2(-o2[0] * geom.sgn, o2[1] * geom.sgn);
    roomGroup.add(post);
    const h = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.03, 24), HANDLE_MAT);
    h.position.set(cx * S, 0.03, cz * S);
    h.userData.corner = i;
    h.visible = !!ui.editRoom;
    roomGroup.add(h);
    handles.push(h);
    const ol = Math.hypot(ox, oz) || 1;
    const el = document.createElement('div');
    if (ui.measure) {
      el.className = 'dimin ang';
      const a = i ? state.room.walls[i - 1].angle ?? 90 : cornerAngle(0); // A 각도는 나머지 벽으로 정해짐
      el.innerHTML = `<span class="corner">${LET(i)}</span><input type="number" step="0.1" data-dim="a${i}" tabindex="${nW + 3 + i}" value="${a}" ${i ? '' : 'disabled'} title="${LET(i)} 모서리의 방 안쪽 각도 (직각 90, 방으로 튀어나온 모서리 270, 일직선 180)">°`;
    } else {
      el.className = 'corner';
      el.textContent = LET(i);
    }
    const lab = new CSS2DObject(el);
    const inset = ui.measure ? 48 : 18;
    lab.position.set((cx - ox / ol * inset) * S, 0.05, (cz - oz / ol * inset) * S);
    dimGroup.add(lab);
  });

  // 1m 눈금
  if (!ui.measure) {
    for (let x = Math.ceil(bounds.minX / 100) * 100; x <= bounds.maxX; x += 100) addDim(`${x / 100}m`, x, bounds.minZ - 45);
    for (let z = Math.ceil(bounds.minZ / 100) * 100; z <= bounds.maxZ; z += 100) addDim(`${z / 100}m`, bounds.minX - 50, z);
  }

  // 그림자 범위
  const cx = (bounds.minX + bounds.maxX) / 2 * S, cz = (bounds.minZ + bounds.maxZ) / 2 * S;
  const span = Math.max(bounds.maxX - bounds.minX, bounds.maxZ - bounds.minZ) * S;
  sun.position.set(cx - span * 0.3, span * 1.2, cz + span * 0.5);
  sun.target.position.set(cx, 0, cz);
  const sc = sun.shadow.camera;
  sc.left = sc.bottom = -span * 0.8; sc.right = sc.top = span * 0.8; sc.far = span * 4;
  sc.updateProjectionMatrix();

  document.getElementById('roomInfo').textContent =
    `외곽 ${Math.round(bounds.maxX - bounds.minX)}×${Math.round(bounds.maxZ - bounds.minZ)}cm · 천장 ${H}cm · 바닥 ${(polyArea(outline) / 10000).toFixed(1)}㎡ · ` +
    `실측 ${state.room.walls.filter(w => w.measured > 0).length}/${nW}벽` + (geom.closeErr > 5 ? ` · ⚠ 닫힘오차 ${geom.closeErr.toFixed(0)}cm` : '');
}
function addDim(text, x, z) {
  const el = document.createElement('div');
  el.className = 'dim';
  el.textContent = text;
  const o = new CSS2DObject(el);
  o.position.set(x * S, 0, z * S);
  dimGroup.add(o);
}
function polyArea(P) {

// ───────── 물품 모델 ─────────
const matCache = new Map();

  return matCache.get(key);

function addBox(g, sx, sy, sz, x, y, z, m, edges = false) {

const BUILD = {

// ───────── 마우스: 선택·끌기 ─────────
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();

function setNDC(e) {
  const r = renderer.domElement.getBoundingClientRect();
  ndc.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1);
  ray.setFromCamera(ndc, camera);
}
function pickHandle(e) {

}
function moveCorner(x, z, free) {
  const st = free ? 1 : (state.settings?.snap || 5);

  const cs = geom.corners.map(c => c.slice()), n = cs.length, i = cornerDrag.i;
  if (!free) for (const nb of [cs[(i - 1 + n) % n], cs[(i + 1) % n]]) { // 이웃 모서리와 줄 맞추기 → 직각
    if (Math.abs(x - nb[0]) < 15) x = nb[0];
    if (Math.abs(z - nb[1]) < 15) z = nb[1];
  }
  if (cs[i][0] === x && cs[i][1] === z) return;
  cs[i] = [x, z];

}
function addCornerAt(e) {

  const x = p.x / S, z = p.z / S, cs = geom.corners, n = cs.length;

    const [x1, z1] = cs[i], [x2, z2] = cs[(i + 1) % n];

  const { i, t } = best;
  commit(() => {
    const ncs = cs.map(c => c.slice());
    ncs.splice(i + 1, 0, [Math.round(best.px), Math.round(best.pz)]);
    const w = state.room.walls[i];
    w.measured = null; w.bulge = 0;
    state.room.walls.splice(i + 1, 0, { kind: w.kind, len: 0, measured: null, angle: 180, bulge: 0, memo: '' });
    const cut = best.L * t;
    state.room.doors.forEach(d => { if (d.wall > i) d.wall++; else if (d.wall === i && d.offset > cut) { d.wall = i + 1; d.offset = Math.round(d.offset - cut); } });

function deleteCorner(i) {

  if (n <= 3 || !confirm(`${LET(i)} 모서리를 지울까요? 양옆 벽이 하나로 합쳐져요.`)) return;
  commit(() => {
    const cs = geom.corners.map(c => c.slice());
    cs.splice(i, 1);
    const prevLen = effLen(state.room.walls[i - 1]);
    state.room.walls[i - 1].measured = null;
    state.room.walls.splice(i, 1);
    state.room.doors.forEach(d => { if (d.wall === i) { d.wall = i - 1; d.offset = Math.round(d.offset + prevLen); } else if (d.wall > i) d.wall--; });

}
function pickItem(e) {

renderer.domElement.addEventListener('pointerdown', e => {

    const i = pickHandle(e);
    if (i === null) return;
    const n = state.room.walls.length;
    if ([state.room.walls[(i - 1 + n) % n], state.room.walls[i]].some(w => w.measured > 0)) {
      alert(`${LET(i)} 모서리에 붙은 벽에 실측값이 있어서 끌 수 없어요.\n[공간 치수] 탭에서 그 벽의 실측 칸을 비우면 옮길 수 있어요.`);

  const p = planePoint();
  if (!p) return;
  drag = { id, ox: it.x - p.x / S, oz: it.z - p.z / S, moved: false, before: JSON.stringify(state) };

const stChip = s => `<span class="st" style="background:${STATUS[s] || STATUS['미정']}">${esc(s || '미정')}</span>`;

function renderList() {
  const q = ui.q.trim().toLowerCase(), f = ui.filter;
  const items = state.items;
  const placedN = items.filter(i => i.placed !== false).length;
  const match = it => {
    if (q && !`${it.name} ${it.cat} ${it.memo} ${TYPES[it.type]}`.toLowerCase().includes(q)) return false;
    if (f === 'placed') return it.placed !== false;
    if (f === 'out') return it.placed === false;
    if (f === 'issue') return !!issues[it.id];
    if (STATUS[f]) return (it.status || '미정') === f;
    return true;
  };
  const byStatus = Object.keys(STATUS).map(s => `<span class="chip" style="background:${STATUS[s]}">${s} ${items.filter(i => (i.status || '미정') === s).length}</span>`).join(' ');
  const issueN = Object.keys(issues).length;
  let h = `<div class="summary">총 <b>${items.length}</b>종 · 배치 <b>${placedN}</b> · 빼둠 <b>${items.length - placedN}</b>${issueN ? ` · <span class="warn">⚠ ${issueN}</span>` : ''}<br>${byStatus}</div>
    <div class="btns">
      <button class="btn" data-act="allout" ${items.some(i => i.placed !== false && !isBuilding(i)) ? '' : 'disabled'}>가구 전체 빼기</button>
      <button class="btn" data-act="allin" ${placedN < items.length ? '' : 'disabled'}>전체 다시 넣기</button>
    </div>`;
  const zones = [...state.zones, { id: '__', name: '기타(구역 없음)' }];
  const zoneIds = new Set(state.zones.map(z => z.id));
  for (const z of zones) {
    const rows = items.filter(it => (z.id === '__' ? !zoneIds.has(it.zone) : it.zone === z.id) && match(it));
    if (!rows.length) continue;
    h += `<h4><span>${esc(z.name)}</span><span>${rows.length}</span></h4>`;
    for (const it of rows) {
      const off = it.placed === false;
      h += `<div class="row ${it.id === selectedId ? 'sel' : ''} ${off ? 'off' : ''}" data-id="${it.id}">
        <input type="checkbox" data-act="toggle" ${off ? '' : 'checked'} title="체크 해제 = 창고에서 빼기">

        <span class="nm" title="${esc(it.memo)}">${esc(it.name)}${it.qty > 1 ? ` ×${it.qty}` : ''}</span>
        <span class="sz">${it.w}×${it.d}×${it.h}</span>${stChip(it.status)}${issues[it.id] ? `<span class="warn" title="${esc(issues[it.id].join('\n'))}">⚠</span>` : ''}
      </div>`;
    }
  }
  h += `<div class="btns"><button class="btn primary" data-act="add">+ 물품 추가</button></div>

}

panel.addEventListener('click', e => {
  const tabBtn = e.target.closest('.tabs button');
  if (tabBtn) return setTab(tabBtn.dataset.tab);
  const actEl = e.target.closest('[data-act]');
  const row = e.target.closest('.row');
  const act = actEl?.dataset.act;
  const i = actEl ? +actEl.dataset.i : -1;
  const it = getItem(selectedId);
  if (act === 'toggle' && row) { const t = getItem(row.dataset.id); return commit(() => { t.placed = t.placed === false; }); }
  if (row) {
    selectedId = row.dataset.id;
    const t = getItem(selectedId);
    if (t.placed !== false) focusItem(t);
    return select(selectedId);
  }
  switch (act) {
    case 'add': {
      const c = center(), id = 'i' + Date.now().toString(36);
      commit(() => state.items.push({ id, zone: state.zones[0]?.id || 'A', name: '새 물품', cat: '', type: 'box', status: '미정', qty: 1,
        x: Math.round(c.x / S / 5) * 5, z: Math.round(c.z / S / 5) * 5, y: 0, w: 60, d: 60, h: 60, rot: 0, color: '#9db4c8', placed: true, memo: '' }));
      return select(id, { tab: 'edit' });
    }
    case 'rot': return commit(() => { it.rot = ((it.rot || 0) + 90) % 360; });
    case 'dup': {
      const id = 'i' + Date.now().toString(36);
      commit(() => state.items.push({ ...clone(it), id, name: it.name + ' (복제)', x: it.x + 20, z: it.z + 20 }));
      return select(id, { tab: 'edit' });
    }
    case 'toggleSel': return commit(() => { it.placed = it.placed === false; });
    case 'focus': return focusItem(it);
    case 'del':
      if (confirm(`"${it.name}"을(를) 목록에서 완전히 삭제할까요? (창고에서 빼기만 하려면 '창고에서 빼기')`)) { commit(() => { state.items = state.items.filter(x => x.id !== it.id); }); select(null); }
      return;
    case 'addwall': return commit(() => {
      const ws = state.room.walls, w = ws[i], half = Math.round(effLen(w) / 2 * 10) / 10;
      ws.splice(i + 1, 0, { ...clone(w), len: Math.round((effLen(w) - half) * 10) / 10, measured: null, bulge: 0, memo: '' });
      Object.assign(w, { len: half, measured: null, angle: 180, bulge: 0 });
      state.room.doors.forEach(d => { if (d.wall > i) d.wall++; else if (d.wall === i && d.offset > half) { d.wall = i + 1; d.offset -= half; } });
    });
    case 'delwall':
      if (state.room.walls.length > 3 && confirm(`벽 ${LET(i)}→${LET((i + 1) % state.room.walls.length)} 을(를) 삭제할까요?`)) commit(() => {
        state.room.walls.splice(i, 1);
        state.room.doors = state.room.doors.filter(d => d.wall !== i);
        state.room.doors.forEach(d => { if (d.wall > i) d.wall--; });
      });
      return;
    case 'roomedit': return setRoomEdit(!ui.editRoom);
    case 'measure': return setMeasure(!ui.measure);
    case 'allout': return commit(() => { state.items.forEach(x => { if (!isBuilding(x)) x.placed = false; }); });
    case 'allin': return commit(() => { state.items.forEach(x => { x.placed = true; }); });
    case 'hist': return loadHistory();
    case 'histload': return openVersion(i);
    case 'expmeas': return download(`실측기입표-v${state.meta.version}.csv`, measCSV(), 'text/csv');
    case 'adddoor': return commit(() => state.room.doors.push({ wall: 0, offset: 100, width: 90, height: 210, type: 'door' }));
    case 'deldoor': return commit(() => state.room.doors.splice(i, 1));
    case 'addzone': return commit(() => state.zones.push({ id: String.fromCharCode(65 + state.zones.length), name: '새 구역' }));
    case 'expjs': return download(`layout.js`, layoutJS(), 'text/javascript');
    case 'expjson': return download(`warehouse-v${state.meta.version}.json`, formatLayout(state), 'application/json');
    case 'expcsv': return download(`물품목록-v${state.meta.version}.csv`, toCSV(), 'text/csv');
    case 'import': return el('importFile').click();
    case 'snap': {
      const snaps = readJSON(SNAP_KEY) || [];
      snaps.unshift({ name: el('snapName').value.trim() || `배치안 ${snaps.length + 1}`, date: new Date().toLocaleString('ko-KR'), data: clone(state) });
      writeJSON(SNAP_KEY, snaps);
      return renderFile();
    }
    case 'snapload': { const s = (readJSON(SNAP_KEY) || [])[i]; if (s && confirm(`"${s.name}" 배치안을 불러올까요? (되돌리기 가능)`)) commit(() => { state = clone(s.data); }); return; }
    case 'snapdel': { const snaps = readJSON(SNAP_KEY) || []; snaps.splice(i, 1); writeJSON(SNAP_KEY, snaps); return renderFile(); }
    case 'reset':
      if (confirm('브라우저에 저장된 변경을 버리고 data/layout.js 기본 배치로 되돌릴까요? (되돌리기 가능)')) commit(() => { state = clone(window.WAREHOUSE_DEFAULT); });
      return;
  }
});
panel.addEventListener('dblclick', e => { const row = e.target.closest('.row'); if (row) setTab('edit'); });
panel.addEventListener('change', e => {
  const t = e.target, d = t.dataset;
  const v = 'num' in d || t.type === 'number' ? (parseFloat(t.value) || 0) : t.value;
  if (d.f) { const it = getItem(selectedId); return commit(() => { it[d.f] = v; }); }
  if (d.r === 'height') return setCeiling(v);
  if (d.r) return commit(() => { state.room[d.r] = v; });
  if (d.start !== undefined) return commit(() => { state.room.start[+d.start] = v; });
  if (d.w !== undefined) return commit(() => {
    const w = state.room.walls[+d.w];
    if (d.k === 'kind') w.kind = v;
    else if (d.k === 'measured') w.measured = t.value.trim() === '' ? null : v;
    else w[d.k] = v;
  });
  if (d.door !== undefined) return commit(() => { state.room.doors[+d.door][d.k] = d.k === 'type' ? v : +v; });
  if (d.zone !== undefined) return commit(() => {
    const z = state.zones[+d.zone];
    if (d.k === 'id') state.items.forEach(it => { if (it.zone === z.id) it.zone = v; });
    z[d.k] = v;
  });
  if (d.meta) return commit(() => { state.meta[d.meta] = v; });
  if (d.cloudf) { cloud[d.cloudf] = t.value.trim(); saveCloud(); return; }
  if (t.id === 'importFile' && t.files[0]) {
    const fr = new FileReader();
    fr.onload = () => {
      try {
        let txt = fr.result;
        if (!txt.trim().startsWith('{')) txt = txt.slice(txt.indexOf('{'), txt.lastIndexOf('}') + 1);
        const obj = JSON.parse(txt);
        if (!obj.room || !Array.isArray(obj.items)) throw new Error('room/items 없음');
        commit(() => { state = obj; });
      } catch (err) { alert('불러오기 실패: ' + err.message); }
    };
    fr.readAsText(t.files[0], 'utf-8');
    t.value = '';
  }
  if (t.id === 'filter') { ui.filter = t.value; renderList(); }
});
el('q').addEventListener('input', e => { ui.q = e.target.value; renderList(); });

// ───────── 내보내기 ─────────
function formatLayout(s) {
  const L = (a, pad) => a.map(x => pad + JSON.stringify(x)).join(',\n');
  const r = s.room;
  return `{
  "meta": ${JSON.stringify(s.meta)},
  "settings": ${JSON.stringify(s.settings || {})},
  "room": {
    "height": ${r.height}, "sill": ${r.sill ?? 80}, "start": ${JSON.stringify(r.start)}, "heading": ${r.heading ?? 0}, "source": ${JSON.stringify(r.source || '추정')},
    "walls": [
${L(r.walls, '      ')}
    ],
    "doors": [
${L(r.doors, '      ')}
    ]
  },
  "zones": [
${L(s.zones, '    ')}
  ],
  "items": [
${L(s.items, '    ')}
  ]
}`;
}
function layoutJS() {
  return `// 창고 배치 데이터 (단위: cm) — 앱에서 내보냄 ${new Date().toLocaleString('ko-KR')}
// - 좌표: X = 입구벽(0)에서 안쪽 방향, Z = 창문벽(0)에서 핑크벽 방향. x/z 는 바닥면 중심, y 는 띄운 높이.
// - room.walls: 모서리 A에서 출발해 한 바퀴 도는 벽 목록. len=추정 길이, measured=실측 길이(있으면 우선), angle=벽 끝 모서리의 방 안쪽 각도, bulge=곡면 휨 깊이.
// - doors.wall 은 walls 순번(0=A→B), offset 은 그 벽 시작 모서리에서 문 중심까지 거리.
window.WAREHOUSE_DEFAULT = ${formatLayout(state)};
`;
}
function measCSV() {
  const n = state.room.walls.length;
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = state.room.walls.map((w, i) => [`${LET(i)}→${LET((i + 1) % n)}`, KINDS[w.kind || 'wall'], w.len, w.measured || '', `${LET((i + 1) % n)}`, w.angle ?? 90, w.bulge || 0, w.memo || ''].map(q).join(','));
  const doors = state.room.doors.map(d => [`문: ${d.name || ''}`, `${LET(d.wall)}→${LET((d.wall + 1) % n)} 위`, `중심 ${d.offset}`, `폭 ${d.width}`, '', `높이 ${d.height || 210}`, '', ''].map(q).join(','));
  return '﻿' + [['벽', '종류', '추정길이cm', '실측길이cm', '끝 모서리', '안쪽각도°', '휨cm', '메모'].map(q).join(','), ...rows, '', `"천장 높이","","${state.room.height}",""`, ...doors].join('\r\n');
}
function toCSV() {
  const zn = Object.fromEntries(state.zones.map(z => [z.id, z.name]));
  const cols = ['구역', '이름', '분류', '모양', '정리상태', '수량', '가로cm', '깊이cm', '높이cm', 'X', 'Z', '띄운높이', '회전', '배치', '메모', '경고'];
  const q = v => `"${String(v ?? '').replace(/"/g, '""')}"`;
  const rows = state.items.map(it => [zn[it.zone] || it.zone, it.name, it.cat, TYPES[it.type] || it.type, it.status, it.qty, it.w, it.d, it.h, it.x, it.z, it.y || 0, it.rot || 0,
    it.placed === false ? '빼둠' : '배치', it.memo, (issues[it.id] || []).join(' / ')].map(q).join(','));
  return '﻿' + [cols.map(q).join(','), ...rows].join('\r\n');
}
function download(name, text, type) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: type + ';charset=utf-8' }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ───────── HUD ─────────
el('btn3d').onclick = view3D;
el('btnTop').onclick = viewTop;
el('btnColor').onclick = () => { ui.colorMode = ui.colorMode === 'status' ? 'color' : 'status'; saveUI(); rebuildItems(); renderPanel(); };
el('btnLabels').onclick = () => { ui.labels = !ui.labels; saveUI(); renderPanel(); };
el('btnUndo').onclick = undo;
el('btnRoomEdit').onclick = () => setRoomEdit(!ui.editRoom);
el('btnMeasure').onclick = () => setMeasure(!ui.measure);

// ───────── 루프 ─────────
function resize() {
  const w = vp.clientWidth, h = vp.clientHeight;
  renderer.setSize(w, h);
  labelRenderer.setSize(w, h);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
new ResizeObserver(resize).observe(vp);
function tick() {
  controls.update();
  for (const w of walls) {
    const out = (camera.position.x - w.mid.x) * w.n.x + (camera.position.z - w.mid.z) * w.n.z > 0;
    for (const [m, base] of w.mats) {
      const o = out ? base * 0.12 : base;
      if (m.opacity !== o) { m.opacity = o; m.depthWrite = o > 0.5; }
    }
  }
  renderer.render(scene, camera);
  labelRenderer.render(scene, camera);
  requestAnimationFrame(tick);
}

resize();
rebuildAll();
setTab(ui.tab === 'edit' ? 'list' : ui.tab);
view3D();
tick();
renderCloud();
if (API) { cloudLoad(); setInterval(cloudPoll, 45000); }
</script>
